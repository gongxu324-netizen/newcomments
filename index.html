<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP Krit × GUCCI — MFW Compliment Generator</title>
<!-- 引入可爱圆润字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    /* 莫兰迪低饱和灰紫到暖燕麦色渐变 */
    background: linear-gradient(135deg, #E5E0EB 0%, #EFECE6 50%, #F5F2EC 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
  }
  .container { width: 100%; max-width: 580px; }
  
  /* 可爱圆润标题（低饱和灰紫） */
  h1 { 
    color: #6B5B7B; 
    text-align: center; 
    font-size: 26px; 
    margin-bottom: 8px; 
    font-family: 'Fredoka', 'Quicksand', -apple-system, sans-serif;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0px #FAF8F5;
  }
  .subtitle { 
    color: #8C7C9C; 
    text-align: center; 
    font-size: 13px; 
    margin-bottom: 22px; 
    line-height: 1.5; 
  }
  
  /* 选项卡样式（燕麦底色与淡紫色边框） */
  .tabs { display: flex; gap: 12px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 12px 10px; text-align: center; border-radius: 14px;
    background: rgba(245, 242, 236, 0.75); color: #7A6B8A;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .25s ease; border: 2px solid transparent;
    box-shadow: 0 4px 10px rgba(107, 91, 123, 0.05);
  }
  .tab.active { 
    background: #FFFFFF; 
    color: #6B5B7B; 
    border-color: #C8BDD3;
    box-shadow: 0 6px 14px rgba(107, 91, 123, 0.1);
  }
  .tab .hash { display: block; font-size: 11px; font-weight: 400; opacity: .8; margin-top: 3px; color: #9A8BAA; }
  
  .stats { color: #7A698B; text-align: center; font-size: 12.5px; margin-bottom: 16px; font-weight: 500; }
  
  /* 低饱和度灰紫色按钮 */
  .btn {
    display: block; width: 100%; padding: 14px;
    background: #8A739C; color: #FAF8F5; font-size: 15px; font-weight: 700;
    border: none; border-radius: 16px; cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    transition: transform .15s, box-shadow .15s, background .2s; margin-bottom: 18px;
    box-shadow: 0 6px 16px rgba(138, 115, 156, 0.25);
  }
  .btn:hover { 
    background: #7B648D;
    transform: translateY(-2px); 
    box-shadow: 0 8px 22px rgba(138, 115, 156, 0.35); 
  }
  .btn:active { transform: translateY(0); }
  
  /* 卡片列表（燕麦乳白纸质感） */
  .card {
    background: rgba(250, 247, 242, 0.9); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px; cursor: pointer;
    transition: transform .15s, background .2s, box-shadow .2s; position: relative;
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 12px rgba(120, 110, 130, 0.06);
  }
  .card:hover { 
    transform: translateY(-2px) scale(1.01); 
    background: #FFFFFF; 
    box-shadow: 0 8px 20px rgba(120, 110, 130, 0.1);
  }
  .card .index { font-size: 11px; color: #A898B8; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .card .char-count { font-size: 11px; color: #8A7B9A; font-weight: 600; }
  .card .tag {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; margin-left: 6px; font-weight: 600;
  }
  .tag.short { background: #E6ECF5; color: #4A6B82; }
  .tag.medium { background: #F5EBE1; color: #9A6B43; }
  .tag.long { background: #EBE4F0; color: #6B5B7B; }
  
  .card .text { font-size: 14.5px; color: #42384C; line-height: 1.6; word-break: break-word; white-space: pre-line; }
  .card .text b { color: #7B648D; font-weight: 700; }
  
  .card .tip {
    position: absolute; right: 14px; top: 14px;
    font-size: 11px; color: #8A739C; opacity: 0; transition: opacity .2s; font-weight: 600;
  }
  .card.copied { background: #F0F7F2; border-color: #C2E0C8; }
  .card.copied .tip { opacity: 1; color: #48935C; }
  
  /* 复制提示 Toast */
  .toast {
    position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #524461; color: #FAF8F5; padding: 10px 24px; border-radius: 20px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 100;
    box-shadow: 0 6px 18px rgba(82, 68, 97, 0.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="container">
  <h1>✨ PP Krit × GUCCI ✨</h1>
  <p class="subtitle">MFW Compliment Generator • Anti-AI Detection System<br>Tap any card to copy text instantly.</p>
  
  <div class="tabs">
    <div class="tab active" id="tabX" data-mode="x">𝕏 X<span class="hash">+ MFW Tags & @ tags</span></div>
    <div class="tab" id="tabIG" data-mode="ig">📸 IG / TT<span class="hash">No hashtags / No @gucci</span></div>
  </div>

  <p class="stats" id="stats">Calculating permutations...</p>
  <button class="btn" id="refreshBtn">🎲 Generate 6 New Compliments</button>
  <div id="list"></div>
</div>
<div class="toast" id="toast">Copied to Clipboard ✓</div>

<script>
// ===== 高多样性文案矩阵（专为嘉宾/代言人视角打造） =====
const DATA_SHOW = {
  PRE: [
    "Honestly", "No lies told", "Just look at him", "Fashion week highlight", 
    "Unreal presence", "Style masterclass", "Without a doubt", "Everyone is talking",
    "Absolute perfection", "Pure elegance", "The main character", "Front row excellence",
    "Beyond stunning", "Effortlessly chic", "Stealing the spotlight", "Serving pure class"
  ],
  SUBJECT: [
    "{name} wearing {brand}", "{name} in full {brand}", "{name} representing {brand}",
    "{name} x {brand} synergy", "the way {name} pulls off {brand}", "{name}'s look for {brand}"
  ],
  ACTION: [
    "is completely next level", "commands the front row effortlessly", "is turning heads everywhere in Milan",
    "defines modern luxury so naturally", "stole the whole event in seconds", "looks like a high-fashion portrait",
    "brought pure ambassador magic", "owns the scene with effortless grace", "delivers editorial perfection"
  ],
  EVALUATION: [
    "The poise and expression are unmatched.", "Every single angle is flawless.",
    "This is how high fashion should be worn.", "Nobody does it quite like him.",
    "An absolute visual triumph for Milan.", "The charisma is off the charts."
  ],
  TAIL: [
    "Truly iconic.", "So proud of him!", "A moment for the books.",
    "Fashion history in the making.", "Unstoppable charm.", "Simply breathtaking."
  ]
};

// 各种可能组合的变体
const NAMES = ["PP Krit", "PPKrit", "PP KRIT"];
const BRANDS_ALL = ["GUCCI", "Gucci", "@GUCCI"];
const BRANDS_NO_AT = ["GUCCI", "Gucci"];
const EMOJIS = ["✨", "🖤", "👑", "🔥", "💫", "👏", "🤍", "🌟", "🥂", "❤️‍🔥", "📸"];
const PUNCTS = [".", "!", " —", "..."];

// X 平台的标语与 Hashtags
const TAGS_X = "PP KRIT X GUCCI MFW26\n#GUCCISS27xPPKRIT\n#GucciTheStoreShow\n#Gucci #PPKritt #MFW\n@gucci @ppkritt";
const LIMIT_X = 280;
const COUNT = 6;

let mode = "x";

// 随机选择器
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const maybe = (str, prob = 0.5) => Math.random() < prob ? str : "";

// 插入零宽隐形字符防止同一段落哈希被系统识别为 Bot 控评
const zeroWidthify = str => str.split("").join(Math.random() < 0.2 ? "\u200B" : "");

function getBrand() {
  const pool = (mode === "ig") ? BRANDS_NO_AT : BRANDS_ALL;
  return rand(pool);
}

function fillVars(text) {
  return text.replace(/\{name\}/g, () => rand(NAMES))
             .replace(/\{brand\}/g, () => getBrand());
}

// 动态文案生成（保证最前端无 Emoji）
function generateText() {
  const isX = mode === "x";
  const matrix = DATA_SHOW;

  let shortProb = Math.random();
  let rawSentence = "";
  let tagType = "medium";

  // 保证开头的句子前绝对不添加任何 Emoji
  if (shortProb < 0.35) {
    // 简短句式
    tagType = "short";
    rawSentence = `${rand(matrix.SUBJECT)} ${rand(matrix.ACTION)}${rand(PUNCTS)} ${maybe(rand(EMOJIS))}`;
  } else if (shortProb < 0.75) {
    // 中等句式
    tagType = "medium";
    rawSentence = `${rand(matrix.PRE)}${rand(PUNCTS)} ${rand(matrix.SUBJECT)} ${rand(matrix.ACTION)}. ${rand(matrix.EVALUATION)} ${maybe(rand(EMOJIS))}`;
  } else {
    // 长句式
    tagType = "long";
    rawSentence = `${rand(matrix.PRE)}, ${rand(matrix.SUBJECT)} ${rand(matrix.ACTION)}. ${rand(matrix.EVALUATION)} ${rand(matrix.TAIL)} ${maybe(rand(EMOJIS))}`;
  }

  let text = fillVars(rawSentence).trim();

  // X 字符数截断/保障机制
  if (isX) {
    const totalLen = text.length + 2 + TAGS_X.length;
    if (totalLen > LIMIT_X) {
      text = text.substring(0, LIMIT_X - TAGS_X.length - 10) + "...";
    }
    text = text + "\n\n" + TAGS_X;
  }

  // 写入防 AI 控评检测零宽字符
  text = zeroWidthify(text);

  return { text, tag: tagType };
}

// 计算当前模式下的总组合数
function updateStats() {
  const bCount = (mode === "ig") ? 2 : 3;
  const matrix = DATA_SHOW;
  
  const totalCombos = matrix.PRE.length * matrix.SUBJECT.length * matrix.ACTION.length * 
                      matrix.EVALUATION.length * matrix.TAIL.length * NAMES.length * bCount * EMOJIS.length;

  document.getElementById("stats").textContent = 
    `🌾 Over ${totalCombos.toLocaleString()} unique randomized variations available!`;
}

// 渲染 6 张卡片
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const seen = new Set();
  let guard = 0;

  while (list.children.length < COUNT && guard < 200) {
    guard++;
    const item = generateText();
    if (seen.has(item.text)) continue;
    seen.add(item.text);

    const card = document.createElement("div");
    card.className = "card";

    // 高亮关键词
    const highlighted = item.text
      .replace(/PP Krit|PPKrit|PP KRIT/g, m => `<b>${m}</b>`)
      .replace(/@?GUCCI|Gucci/g, m => `<b>${m}</b>`);

    card.innerHTML = `
      <div class="index">
        <div>#${list.children.length + 1}<span class="tag ${item.tag}">${item.tag}</span></div>
        <div class="char-count">${item.text.length} chars</div>
      </div>
      <div class="text">${highlighted}</div>
      <div class="tip">Tap to Copy</div>
    `;

    card.addEventListener("click", () => copyText(item.text, card));
    list.appendChild(card);
  }
}

// 一键复制
async function copyText(text, card) {
  const cleanText = text.replace(/\u200B/g, "");
  try {
    await navigator.clipboard.writeText(cleanText);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = cleanText;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
  }, 1500);
}

// 事件监听
document.getElementById("refreshBtn").addEventListener("click", render);

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (mode === tab.dataset.mode) return;
    mode = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    updateStats();
    render();
  });
});

// 初始化
updateStats();
render();
</script>
</body>
</html>
